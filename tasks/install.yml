---
- name: Ensure Browserless path exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ browserless_uid }}"
    group: "{{ browserless_gid }}"
  with_items:
    - "{{ browserless_base_path }}"

- name: Ensure Browserless support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ browserless_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ browserless_uid }}"
    group: "{{ browserless_gid }}"
  with_items:
    - env
    - labels

- name: Ensure Browserless container image is pulled via community.docker.docker_image
  when: sysd_docker_image_pull_method == 'ansible-module'
  community.docker.docker_image:
    name: "{{ browserless_container_image }}"
    source: "{{ 'pull' if ansible_version.major > 2 or ansible_version.minor > 7 else omit }}"
    force_source: "{{ browserless_container_image_force_pull if ansible_version.major > 2 or ansible_version.minor >= 8 else omit }}"
    force: "{{ omit if ansible_version.major > 2 or ansible_version.minor >= 8 else browserless_container_image_force_pull }}"
  register: result
  retries: "{{ container_container_retry }}"
  delay: "{{ container_retry }}"
  until: result is not failed

- name: Ensure Browserless container image is pulled via ansible.builtin.command
  when: sysd_docker_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ sysd_docker_host_command }} pull {{ browserless_container_image }}"
  register: result
  retries: "{{ container_container_retry }}"
  delay: "{{ container_retry }}"
  until: result is not failed
  changed_when: "'Downloaded newer image' in result.stdout"

- name: Ensure Browserless container network is created via community.docker.docker_network
  when: sysd_docker_net_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ sysd_docker_ipv6_enabled }}"
    name: "{{ browserless_container_network }}"
    driver: bridge
    driver_options: "{{ sysd_docker_net_driver_opts }}"

- name: Ensure Browserless container network is created via ansible.builtin.command
  when: sysd_docker_net_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ sysd_docker_host_command }} network create
      {% if sysd_docker_ipv6_enabled %}--ipv6{% endif %}
      {{ sysd_docker_net_driver_opts_string }}
      {{ browserless_container_network }}
  register: network_creation_result
  changed_when: network_creation_result.rc == 0
  failed_when: network_creation_result.rc != 0 and 'already exists' not in network_creation_result.stderr

- name: Ensure Browserless systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/browserless.service.j2"
    dest: "{{ sysd_docker_service_path }}/{{ browserless_identifier }}.service"
    mode: "0644"
